<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1E3">
<title>NoFuss Pips Say Hi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one full phone screen. Title up top, the hero pip center stage, a crowd of pips piling up from the bottom edge. Flat brand color on cream, no gradients or shadows. */
:root {
  color-scheme: light;
  --cream: #F3F1E3;
  --ink: #12171A;
  --burgundy: #7F0039;
  --yellow: #FEBC35;
  --magenta: #FE02B9;
  --coral: #FB6A67;
  --periwinkle: #70A2F8;
  --pink: #E7C4CB;
  --paper: #FBFAF3;
  --muted: #5B5A52;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--display); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

.stage { position: fixed; inset: 0; overflow: hidden; background: var(--cream); cursor: pointer; }

/* Title */
.title { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 1.2vh; text-align: center; z-index: 40; pointer-events: none; }
.kicker { font-family: var(--mono); font-size: clamp(11px, 3.2vw, 14px); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); opacity: 0; }
.welcome { font-weight: 700; font-size: clamp(22px, 6.6vw, 34px); letter-spacing: -0.02em; line-height: 1; opacity: 0; }
.logo { font-weight: 900; font-size: clamp(64px, 21vw, 116px); letter-spacing: -0.055em; line-height: 0.9; display: inline-flex; align-items: baseline; text-transform: lowercase; }
.logo .ch { display: inline-block; opacity: 0; }
.eye-o { display: inline-flex; align-items: center; justify-content: center; gap: 0.085em; width: 0.6em; height: 0.6em; border: 0.11em solid currentColor; border-radius: 50%; box-sizing: border-box; margin: 0 0.02em; transform: translateY(0.02em); }
.eye-o i { width: 0.09em; height: 0.09em; border-radius: 50%; background: currentColor; display: block; animation: blink 4.2s infinite 1.5s; }
.tag { font-weight: 500; font-size: clamp(15px, 4.4vw, 20px); color: var(--muted); opacity: 0; }

/* Pips */
.pip { position: absolute; display: flex; align-items: flex-start; justify-content: center; will-change: transform; }
.pip .eyes { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
.pip .eyes i { display: block; border-radius: 50%; background: var(--eye, var(--ink)); animation: blink var(--blink, 5s) infinite var(--blink-delay, 0s); transform-origin: center; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }

/* Speech bubble (a child of the hero pip, so it grows and shrinks with it) */
.bubble { position: absolute; z-index: 60; white-space: nowrap; background: var(--ink); color: var(--cream); font-weight: 900; letter-spacing: -0.03em; line-height: 1; padding: 0.32em 0.5em 0.38em; border-radius: 0.55em; opacity: 0; transform-origin: 0% 100%; pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: 0.35em; bottom: -0.32em; width: 0.5em; height: 0.5em; background: var(--ink); border-radius: 0 0 0.5em 0; transform: skewX(-25deg); }

/* Replay */
.replay { position: absolute; z-index: 80; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(14px, env(safe-area-inset-right, 0px)); font: 600 13px var(--display); color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; opacity: 0; transition: opacity 0.4s; }
.replay.show { opacity: 1; }
.replay:focus-visible { outline: 3px solid var(--periwinkle); outline-offset: 3px; }
.hint { position: absolute; z-index: 80; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); opacity: 0; transition: opacity 0.6s; pointer-events: none; }
.hint span { background: var(--paper); padding: 4px 10px; border-radius: 999px; }
.hint.show { opacity: 0.85; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="A yellow character with two dot eyes bounces in and says hi, then a crowd of colorful characters fills the screen. Welcome to NoFuss.">
  <div class="title" id="title">
    <div class="kicker" id="kicker">Group Green · Parsons</div>
    <div class="welcome" id="welcome">welcome to</div>
    <div class="logo" id="logo" aria-hidden="true"><span class="ch">n</span><span class="ch"><span class="eye-o"><i></i><i></i></span></span><span class="ch">f</span><span class="ch">u</span><span class="ch">s</span><span class="ch">s</span></div>
    <span class="sr">NoFuss</span>
    <div class="tag" id="tag">your event, no fuss.</div>
  </div>
  <button class="replay" id="replay" type="button">Replay</button>
  <div class="hint" id="hint"><span>tap to make them jump</span></div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var replayBtn = document.getElementById('replay');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var C = {
    burgundy: '#7F0039', yellow: '#FEBC35', magenta: '#FE02B9', coral: '#FB6A67',
    periwinkle: '#70A2F8', pink: '#E7C4CB', ink: '#12171A', cream: '#F3F1E3', paper: '#FBFAF3'
  };
  var palette = [C.burgundy, C.yellow, C.magenta, C.coral, C.periwinkle, C.pink, C.ink];
  var darkFills = [C.burgundy, C.magenta, C.ink];
  var shapes = ['circle', 'pill', 'square', 'arch', 'half'];

  var pips = [], leavers = [], hero = null, bubble = null, timers = [], idleTimer = null, geo = null;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }

  function makePip(shape, color, size) {
    var el = document.createElement('div');
    el.className = 'pip';
    var w = size, h = size, r = '50%', eyeY = 0.4;
    if (shape === 'pill') { w = size * 0.64; h = size; r = '999px'; eyeY = 0.3; }
    else if (shape === 'square') { r = (size * 0.24) + 'px'; eyeY = 0.38; }
    else if (shape === 'arch') { w = size; h = size * 1.08; r = (size / 2) + 'px ' + (size / 2) + 'px ' + (size * 0.08) + 'px ' + (size * 0.08) + 'px'; eyeY = 0.42; }
    else if (shape === 'half') { w = size * 1.1; h = size * 0.58; r = (size * 0.55) + 'px ' + (size * 0.55) + 'px ' + (size * 0.06) + 'px ' + (size * 0.06) + 'px'; eyeY = 0.48; }
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.borderRadius = r;
    el.style.background = color;
    var eyes = document.createElement('div');
    eyes.className = 'eyes';
    var d = Math.max(4, size * 0.095);
    eyes.style.top = (h * eyeY) + 'px';
    eyes.style.gap = (size * 0.15) + 'px';
    for (var k = 0; k < 2; k++) {
      var e = document.createElement('i');
      e.style.width = d + 'px';
      e.style.height = d + 'px';
      eyes.appendChild(e);
    }
    el.style.setProperty('--eye', darkFills.indexOf(color) >= 0 ? C.cream : C.ink);
    el.style.setProperty('--blink', rand(3.5, 6.5).toFixed(2) + 's');
    el.style.setProperty('--blink-delay', rand(0, 4).toFixed(2) + 's');
    el.appendChild(eyes);
    el._w = w; el._h = h;
    return el;
  }

  function clear() {
    timers.forEach(clearTimeout); timers = [];
    if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
    pips.concat(leavers).forEach(function (p) { p.remove(); });
    pips = []; leavers = [];
    if (hero) { hero.remove(); hero = null; bubble = null; }
    ['kicker', 'welcome', 'tag'].forEach(function (id) {
      var el = document.getElementById(id); el.getAnimations().forEach(function (a) { a.cancel(); }); el.style.opacity = 0;
    });
    document.querySelectorAll('.logo .ch').forEach(function (c) { c.getAnimations().forEach(function (a) { a.cancel(); }); c.style.opacity = 0; });
    replayBtn.classList.remove('show');
    hint.classList.remove('show');
  }

  // Lays out pips in rows from the bottom edge up to the top of the screen.
  // The bottom third stays; everything above it falls away later.
  function build() {
    var W = stage.clientWidth, H = stage.clientHeight;
    var unit = Math.min(W, 520);
    var base = unit * 0.2;
    var step = base * 0.62;
    var keepRows = Math.max(2, Math.round((H / 4.2) / step));
    var totalRows = Math.ceil((H + base) / step);

    for (var row = totalRows - 1; row >= 0; row--) {
      var x = -base * 0.4 + rand(-10, 10);
      while (x < W + base * 0.1) {
        var size = base * rand(0.85, 1.25);
        var p = makePip(pick(shapes), pick(palette), size);
        var bottom = -p._h * 0.18 + row * step + rand(-6, 6);
        p._left = x;
        p._top = H - bottom - p._h;
        p.style.left = p._left + 'px';
        p.style.top = p._top + 'px';
        p.style.zIndex = Math.max(1, 30 - row);
        p._row = row;
        stage.appendChild(p);
        (row < keepRows ? pips : leavers).push(p);
        x += p._w * rand(0.72, 0.9);
      }
    }

    // Hero: final size and spot, centered between the title and the pile.
    var hs = unit * 0.36;
    hero = makePip('circle', C.yellow, hs);
    var pileTop = H - (keepRows * step + base * 0.5);
    var titleBottom = document.getElementById('tag').getBoundingClientRect().bottom;
    // Keep the hi! bubble clear of the tagline, and sit the hero just above the pile.
    var minTop = titleBottom + hs * 0.46 + hs * 0.28 + 18;
    var mid = (titleBottom + pileTop) / 2 - hs / 2 + hs * 0.25;
    hero._left = W / 2 - hero._w / 2;
    hero._top = Math.min(pileTop - hs * 0.4, Math.max(minTop, mid));
    hero.style.left = hero._left + 'px';
    hero.style.top = hero._top + 'px';
    hero.style.zIndex = 50;

    bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = 'hi!';
    bubble.style.fontSize = Math.round(hs * 0.28) + 'px';
    bubble.style.left = (hs * 0.52) + 'px';
    bubble.style.top = (-hs * 0.46) + 'px';
    hero.appendChild(bubble);
    stage.appendChild(hero);

    geo = { W: W, H: H, hs: hs, base: base };
    return geo;
  }

  function showFinal() {
    leavers.forEach(function (p) { p.remove(); }); leavers = [];
    ['kicker', 'welcome', 'tag'].forEach(function (id) { document.getElementById(id).style.opacity = 1; });
    document.querySelectorAll('.logo .ch').forEach(function (c) { c.style.opacity = 1; });
    bubble.style.opacity = 1;
    replayBtn.classList.add('show');
    hint.classList.add('show');
  }

  function play() {
    clear();
    var m = build();
    if (reduce) { showFinal(); return; }

    pips.concat(leavers).forEach(function (p) { p.style.opacity = 0; });
    hero.style.opacity = 0;

    // Big hero: about half the screen, centered.
    var big = Math.min(m.W * 0.74, m.H * 0.42) / m.hs;
    var bigDx = m.W / 2 - (hero._left + m.hs / 2);
    var bigDy = m.H * 0.52 - (hero._top + m.hs / 2);
    var bigT = 'translate(' + bigDx + 'px,' + bigDy + 'px) scale(' + big + ')';
    var fromX = m.W - hero._left + m.hs * 0.4;
    var fromY = m.H - hero._top + m.hs * 0.4;

    // 1) The hero bounces in big from the bottom-right corner (0.2s to 1.1s).
    later(function () {
      hero.style.opacity = 1;
      hero.animate([
        { transform: 'translate(' + fromX + 'px,' + fromY + 'px) scale(' + (big * 0.6) + ') rotate(40deg)' },
        { transform: 'translate(' + (bigDx + m.W * 0.08) + 'px,' + (bigDy - m.H * 0.08) + 'px) scale(' + big + ') rotate(8deg)', offset: 0.55, easing: 'cubic-bezier(.4,0,.9,.6)' },
        { transform: 'translate(' + bigDx + 'px,' + bigDy + 'px) scale(' + (big * 1.12) + ',' + (big * 0.86) + ')', offset: 0.8, easing: 'ease-out' },
        { transform: bigT }
      ], { duration: 900, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' });
    }, 200);

    // 2) "hi!" pops while the hero is big (1.15s).
    later(function () {
      bubble.animate([
        { opacity: 0, transform: 'scale(0.3) rotate(-12deg)' },
        { opacity: 1, transform: 'scale(1.15) rotate(4deg)', offset: 0.6 },
        { opacity: 1, transform: 'scale(1) rotate(0)' }
      ], { duration: 360, easing: 'ease-out', fill: 'forwards' });
    }, 1150);

    // 3) The hero shrinks into its spot in the center (1.75s to 2.3s).
    later(function () {
      hero.getAnimations().forEach(function (a) { a.cancel(); });
      hero.animate([
        { transform: bigT },
        { transform: 'translate(0,0) scale(0.9,1.1)', offset: 0.75 },
        { transform: 'translate(0,0) scale(1)' }
      ], { duration: 560, easing: 'cubic-bezier(.5,0,.2,1)' });
    }, 1750);

    // 4) Pips rain down until the whole screen is full (2.0s to ~3.6s).
    var all = pips.concat(leavers).sort(function (a, b) { return (a._row - b._row) || (Math.random() - 0.5); });
    var span = 1100;
    all.forEach(function (p, i) {
      later(function () { drop(p, m.H); }, 2000 + (i / all.length) * span + rand(0, 80));
    });

    // 5) Everything above the bottom third falls away (from 3.7s).
    later(function () {
      leavers.forEach(function (p) {
        var dist = m.H - p._top + p._h + 40;
        var delay = Math.max(0, (p._top / m.H)) * 160 + rand(0, 140);
        var a = p.animate([
          { transform: 'translateY(0) rotate(0)' },
          { transform: 'translateY(' + (-m.base * 0.25) + 'px) rotate(' + rand(-8, 8) + 'deg)', offset: 0.2, easing: 'ease-in' },
          { transform: 'translateY(' + dist + 'px) rotate(' + rand(-30, 30) + 'deg)' }
        ], { duration: 650, delay: delay, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' });
        a.onfinish = function () { p.remove(); };
      });
      later(function () { leavers = []; }, 1000);
    }, 3700);

    // 6) Title lands once the screen has cleared (4.45s to 5.4s).
    later(function () {
      fadeUp(document.getElementById('kicker'), 0);
      fadeUp(document.getElementById('welcome'), 100);
      document.querySelectorAll('.logo .ch').forEach(function (c, i) {
        c.animate([
          { opacity: 0, transform: 'translateY(-60%) scale(0.6)' },
          { opacity: 1, transform: 'translateY(8%) scale(1.08,0.92)', offset: 0.65 },
          { opacity: 1, transform: 'translateY(0) scale(1)' }
        ], { duration: 500, delay: 220 + i * 60, easing: 'cubic-bezier(.3,.1,.3,1)', fill: 'forwards' });
      });
      fadeUp(document.getElementById('tag'), 700);
      hop(hero, m.hs * 0.28, 460, 250);
    }, 4450);

    // 7) Idle: a few pips keep bouncing.
    later(function () {
      replayBtn.classList.add('show');
      hint.classList.add('show');
      idleTimer = setInterval(function () {
        hop(pick(pips), 16, 420);
        if (Math.random() < 0.3) hop(hero, m.hs * 0.14, 420);
      }, 700);
    }, 5500);
  }

  function drop(p, H) {
    p.style.opacity = 1;
    var fall = p._top + p._h + H * 0.1;
    var r = rand(-25, 25);
    p.animate([
      { transform: 'translateY(' + (-fall) + 'px) rotate(' + r + 'deg)' },
      { transform: 'translateY(0) rotate(0) scale(1.14,0.84)', offset: 0.62, easing: 'ease-out' },
      { transform: 'translateY(' + (-p._h * 0.2) + 'px) scale(0.94,1.06)', offset: 0.82, easing: 'ease-in' },
      { transform: 'translateY(0) scale(1,1)' }
    ], { duration: 650, easing: 'cubic-bezier(.55,0,.85,.35)', fill: 'backwards' });
  }

  function hop(el, height, dur, delay) {
    if (!el) return;
    el.animate([
      { transform: 'translateY(0) scale(1,1)' },
      { transform: 'translateY(0) scale(1.08,0.9)', offset: 0.15 },
      { transform: 'translateY(' + (-height) + 'px) scale(0.95,1.06)', offset: 0.5, easing: 'ease-in' },
      { transform: 'translateY(0) scale(1.08,0.92)', offset: 0.85 },
      { transform: 'translateY(0) scale(1,1)' }
    ], { duration: dur, delay: delay || 0, easing: 'ease-out', composite: 'add' });
  }

  function fadeUp(el, delay) {
    el.animate([
      { opacity: 0, transform: 'translateY(10px)' },
      { opacity: 1, transform: 'translateY(0)' }
    ], { duration: 420, delay: delay, easing: 'ease-out', fill: 'forwards' });
  }

  // Tap: only the pips near your finger jump; the closest jump highest.
  stage.addEventListener('pointerdown', function (ev) {
    if (ev.target === replayBtn || !geo) return;
    var radius = Math.max(70, Math.min(geo.W, geo.H) * 0.26);
    var group = pips.concat(hero ? [hero] : []);
    group.forEach(function (p) {
      var cx = p._left + p._w / 2, cy = p._top + p._h / 2;
      var dist = Math.hypot(cx - ev.clientX, cy - ev.clientY);
      if (dist > radius + p._w / 2) return;
      var power = 1 - Math.min(1, dist / (radius + p._w / 2));
      var h = (p === hero ? geo.hs * 0.35 : geo.base * 0.55) * (0.45 + power * 0.75);
      hop(p, h, 460, dist * 0.5);
    });
  });

  replayBtn.addEventListener('click', function (ev) { ev.stopPropagation(); play(); });

  var resizeT = null, lastW = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (Math.abs(stage.clientWidth - lastW) < 2) return;
      lastW = stage.clientWidth;
      clear(); build(); showFinal();
      idleTimer = setInterval(function () { hop(pick(pips), 16, 420); }, 700);
    }, 250);
  });

  function start() { lastW = stage.clientWidth; play(); }
  if (document.fonts && document.fonts.ready) {
    var started = false;
    var go = function () { if (!started) { started = true; start(); } };
    document.fonts.ready.then(go);
    setTimeout(go, 900);
  } else { start(); }
})();
</script>
</body>
</html>
